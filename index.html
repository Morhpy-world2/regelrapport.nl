  /* Eén plaat (1000×1300 eenheden): rapporten boven, documentgenerator midden, sjabloon onder.
     Alles staat er vanaf het begin, grijs; de film zet steeds één deel op de voorgrond. Bewust één licht thema. */
  :root {
    --papier: #fffefa; --inkt: #1f2b4f; --inkt-zacht: #4a5578;
    --geel: #fbefbd; --blauw: #dfeaf8;
    --groen: #3f8f55; --groen-licht: #dcf1e0; --groen-vast: #eef8f0;
    --kop: "Kalam", "Comic Sans MS", cursive;
    --hand: "Patrick Hand", "Kalam", "Comic Sans MS", cursive;
    color-scheme: light;
  }
  html, body { background: var(--papier); color: var(--inkt); }
  body {
    font-family: var(--hand); margin: 0;
    padding-block: 20px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  .stage { position: relative; width: calc(100% * 1000 / 1920); max-width: 640px; margin: 0 auto; aspect-ratio: 1000 / 1300; container-type: inline-size; }
  .lijnen, .agents { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .agents { z-index: 6; }

  /* voorgrond / achtergrond */
  .deel { transition: opacity .8s, filter .8s, transform 1.2s cubic-bezier(.6,.05,.3,1); }
  .geest { opacity: .22; filter: grayscale(1) blur(1.2px); }

  /* toegangslijnen */
  .lijn { stroke: var(--inkt); stroke-width: 2.4; stroke-dasharray: 7 8; stroke-linecap: round; fill: none; opacity: .18; transition: opacity .8s; }
  .lijn.aan { opacity: .9; }

  /* rapporten */
  .rap {
    position: absolute; top: 1.54%; height: 20%; width: 26%; box-sizing: border-box; container-type: inline-size;
    background: #fff; border: 2px solid var(--inkt); border-radius: 6px 9px 7px 8px;
    padding: 8px 10px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .rap.focus { transform: scale(1.08); }
  .rap b { font-family: var(--kop); font-weight: 700; font-size: 12cqw; line-height: 1; }
  .rap small { font-size: 7cqw; color: var(--inkt-zacht); }
  .rap i { display: block; height: 2.6cqw; border-radius: 2px; background: #e3e6ee; }
  .rap small.hfd { font-family: var(--kop); font-weight: 700; color: var(--inkt); margin-bottom: -4px; }
  .rap .pass { font-size: 7cqw; line-height: 1.2; padding: 1.5cqw 3cqw; border-radius: 3px; background: var(--k); transition: box-shadow .3s; }
  .rap .pass.mark { box-shadow: 0 0 0 1.2cqw var(--kd); }

  /* documentgenerator */
  .gen {
    position: absolute; left: 33%; width: 34%; top: 27.69%; height: 12.31%; box-sizing: border-box; container-type: inline-size;
    background: var(--blauw); border: 2.5px solid var(--inkt); border-radius: 14px 17px 13px 18px;
    display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 10px;
  }
  .gen.focus { transform: scale(1.1); }
  .gen b { font-family: var(--kop); font-weight: 700; font-size: 7.6cqw; white-space: nowrap; }
  .gen svg { width: 13cqw; height: 13cqw; flex: none; }
  .tw { transform-box: fill-box; transform-origin: center; }
  .gen.werkt .tw, .agent .tw { animation: draai 1.4s linear infinite; }
  @keyframes draai { to { transform: rotate(360deg); } }

  /* het vel */
  .vel {
    position: absolute; left: 30%; width: 40%; top: 49.23%; aspect-ratio: 210 / 297; box-sizing: border-box; container-type: inline-size;
    background: #fff; border: 2.5px solid var(--inkt); border-radius: 6px 9px 7px 8px;
    box-shadow: 8px 10px 0 var(--blauw); transform-origin: 50% 50%;
  }
  .vel.groot { transform: translate(13%, -64%) scale(1.5); z-index: 5; }
  .veltitel {
    position: absolute; top: 3%; left: 8%; right: 8%;
    font-family: var(--kop); font-weight: 700; font-size: 9cqw; line-height: 1.1;
    padding-bottom: 1.5cqw; border-bottom: 2px solid var(--inkt);
  }
  /* de bak met vaste regels (per bedrijf) */
  .bak {
    position: absolute; left: 2%; width: 20%; top: 52%; box-sizing: border-box; container-type: inline-size;
    background: var(--geel); border: 2px solid var(--inkt); border-radius: 8px 11px 7px 10px;
    padding: 8px 8px 6px; transition: opacity .8s, filter .8s, transform 1.2s cubic-bezier(.6,.05,.3,1), box-shadow .3s;
  }
  .bak.focus { transform: scale(1.08); }
  .bak.mark { box-shadow: 0 0 0 5px #b8952a; }
  .bak b { display: block; font-family: var(--kop); font-weight: 700; font-size: 13cqw; line-height: 1.05; }
  .bak small { display: block; font-size: 9cqw; color: var(--inkt-zacht); margin-bottom: 4px; }
  .bak ul { list-style: none; margin: 0; padding: 0; }
  .bak li { font-size: 8.6cqw; line-height: 1.15; padding: 2px 4px; margin-top: 3px; border-radius: 3px; background: #fffbe8; transition: background .4s, box-shadow .4s; }
  .bak li.titel { background: none; padding-left: 0; font-weight: 700; font-family: var(--kop); }
  .bak li.sub { margin-left: 8%; }
  .bak li.titel.gloei { box-shadow: none; background: none; color: var(--groen); }
  .bak li.titel:not(:first-child) { margin-top: 8px; }
  .bak li.mark { background: #fff; box-shadow: 0 0 0 3px #b8952a; }
  .bak li.gloei { background: #fff; box-shadow: 0 0 0 2px var(--groen); }
  .zone {
    position: absolute; left: 8%; right: 8%;
    border: 2px dashed transparent; border-radius: 6px;
    transition: background .6s, border-color .6s, box-shadow .6s;
  }
  .zone .tag {
    position: absolute; left: 3cqw; top: 50%;
    font-family: var(--kop); font-weight: 700; font-size: 4cqw; color: var(--groen);
    opacity: 0; transform: translateY(calc(-50% + 10px));
    transition: opacity .5s, transform .5s;
  }
  .zone.gloei { background: var(--groen-licht); border-color: var(--groen); box-shadow: 0 0 0 5px rgba(63,143,85,.18); }
  .zone.gloei .tag, .zone.vast .tag { opacity: 1; transform: translateY(-50%); }
  .zone.vast { background: var(--groen-vast); border-color: #a9d3b3; box-shadow: none; }
  .zone.vast .tag { opacity: .75; }
  .zone .tag.kop { top: 1.5cqw; transform: translateY(10px); font-size: 4.2cqw; }
  .zone.gloei .tag.kop, .zone.vast .tag.kop { transform: none; }
  .zone .tag.cap { left: 0; right: 0; top: auto; bottom: -6cqw; text-align: center; transform: translateY(10px);
    font-family: var(--hand); font-style: italic; font-weight: 400; font-size: 3.6cqw; color: var(--inkt-zacht); }
  .zone.gloei .tag.cap, .zone.vast .tag.cap { transform: none; opacity: 1; }
  .zone.gevuld { background: #fff; border-color: var(--kd); border-style: solid; }
  .zone.gevuld .tag.kop { color: var(--kd); opacity: 1; }
  .landing {
    position: absolute; left: 2cqw; right: 2cqw; top: 40%; bottom: 10%;
    display: flex; align-items: center; padding: 0 2.5cqw; overflow: hidden;
    border-radius: 4px; background: var(--k); border-left: 1.8cqw solid var(--kd);
    font-family: var(--kop); font-weight: 700; font-size: 4.2cqw; line-height: 1.1;
    animation: inland .5s ease;
  }
  .zone > .tag:not(.kop):not(.cap) { transition: opacity .3s; }
  .zone.gevuld > .tag:not(.kop):not(.cap) { opacity: 0; }
  .zone .tag.cap { white-space: nowrap; left: -60%; right: -60%; }
  .zone.kopzone, .zone.tekstzone { left: 6%; }
  .zone.kopzone.vast, .zone.tekstzone.vast { background: none; border-color: transparent; }

  /* vakken onder 3 Conclusie: geen kaders, alleen een subkop en één regel tekst */
  .zone.vakzone, .zone.vakzone.vast, .zone.vakzone.gevuld { background: none; border-color: transparent; box-shadow: none; }
  .zone.vakzone.gloei { background: var(--groen-licht); border-color: transparent; box-shadow: none; }

  .zone.vakzone .leeg { position: absolute; left: 3cqw; width: 58%; top: 50%; height: 1.8cqw; border-radius: 2px; background: #dfe3ec; opacity: 0; transition: opacity .4s; }
  .zone.vakzone.gloei .leeg, .zone.vakzone.vast .leeg { opacity: 1; }
  .zone.vakzone.gevuld .leeg { opacity: 0; }
  .zone.vakzone .landing { top: 44%; bottom: auto; left: 3cqw; right: 3cqw; padding: .9cqw 2.5cqw; border-left-width: 1.2cqw;
    font-size: 3.8cqw; line-height: 1.2; overflow: visible; }
  /* oplichten zonder vlakken: alleen de inhoud kleurt even groen */
  .zone.gloei, .zone.vast, .zone.vakzone.gloei { background: none; border-color: transparent; box-shadow: none; }
  /* lege opbouw: grijze, nog naamloze vakken zodra het rapport naar voren komt */
  @keyframes voorin { from { opacity: 0; } }
  .zone.voor::before { content: ""; position: absolute; border-radius: 2px; background: #e3e7ef; animation: voorin .6s ease; }
  .zone.kopzone.voor::before { left: 1cqw; top: 22%; width: 42%; height: 3.2cqw; }
  .zone.vakzone.voor::before { left: 3cqw; top: 4%; width: 34%; height: 2.6cqw; }
  .zone.kaderzone.voor::before { display: none; }
  .zone.voor .kr, .zone.vakzone.voor .leeg { opacity: 1; }
  .zone.figuurzone.voor { border: 1.5px dashed #cfd5e0; background: #f5f7fa; }
  .zone.figuurzone.voor::before { display: none; }
  .zone.figuurzone.gloei, .zone.figuurzone.vast { border: 1.5px solid #c9cfdd; }
  .zone.figuurzone.gloei { border-color: var(--groen); }

  .zone.gloei .kr, .zone.vakzone.gloei .leeg { background: #bfe3c8; }

  /* het kaartje dat een agent meeneemt */

  .noot.links { text-align: right; }

  .kopstrook { position: relative; }

  /* drie proefstijlen voor de bijschriften (keuze via de knoppen) */

  .bs-a .bijschrift.rechts { transform: translate(-18px, -50%); } .bs-a .bijschrift.links { transform: translate(18px, -50%); }

  /* C · inktlabel: donkerblauw label met wit schrift en een puntje naar het onderdeel */
  .bs-c .bijschrift, .bs-d .bijschrift, .bs-e .bijschrift { font-family: var(--hand); font-weight: 400; font-size: 4.2cqw; line-height: 1.15; transition: opacity .6s ease, transform .6s cubic-bezier(.3,1.5,.5,1); }
  .bs-d .bijschrift, .bs-e .bijschrift { transform: translateY(-50%) scale(.85); } .bs-d .bijschrift.rechts, .bs-e .bijschrift.rechts { transform-origin: 0 50%; }
  .bs-d .bijschrift.links, .bs-e .bijschrift.links { transform-origin: 100% 50%; } .bs-d .bijschrift.aan, .bs-e .bijschrift.aan { transform: translateY(-50%) scale(1); }

  .bs-d .bijschrift span::before { content: ""; position: absolute; top: 50%; width: 2cqw; height: 2cqw; margin-top: -1cqw; background: var(--blauw);
    border: 2px solid var(--inkt); transform: rotate(45deg); }

  .bs-d .bijschrift.links span::before { right: -1.15cqw; border-bottom: none; border-left: none; }
  /* label 3 · pil met lijntje: donkerblauwe pil, dun lijntje met stip naar het onderdeel */
  .bs-e .bijschrift span { position: relative; display: inline-block; text-align: left; background: var(--inkt); color: #fff;
    border-radius: 3cqw; padding: 1cqw 2.8cqw 1.2cqw; }
  .bs-e .bijschrift span::before { content: ""; position: absolute; top: 50%; width: 4.5cqw; border-top: 2px solid var(--inkt); }
  .bs-e .bijschrift span::after { content: ""; position: absolute; top: 50%; width: 1.4cqw; height: 1.4cqw; margin-top: calc(-.7cqw + 1px); border-radius: 50%; background: var(--inkt); }
  .bs-e .bijschrift.rechts span::before { right: 100%; } .bs-e .bijschrift.rechts span::after { right: calc(100% + 4.5cqw); }
  .bs-e .bijschrift.links span::before { left: 100%; } .bs-e .bijschrift.links span::after { left: calc(100% + 4.5cqw); }
  .bs-e .bijschrift.rechts { margin-left: 5cqw; } .bs-e .bijschrift.links { margin-left: -5cqw; }
  .bs-c .bijschrift span { position: relative; display: inline-block; text-align: left; background: var(--inkt); color: #fff;
    border-radius: 9px; padding: 1.1cqw 2.2cqw 1.3cqw; }

<body>
<div class="knoppen"><button id="opnieuw" type="button">&#8635; Opnieuw</button></div>
<div class="kopstrook">
<header class="plaatkop" id="plaatkop">
  <h1>Van onderzoeken naar rapport</h1>
  <p>De documentgenerator zet de normen en conclusies uit losse onderzoeken op vaste plekken in een rapport, volgens het sjabloon van het bedrijf.</p>
</header>
</div>

<div class="stage" id="stage" role="img" aria-label="Animatie: een rapport dat volgens een sjabloon wordt opgebouwd. Het sjabloon van het bedrijf legt de opbouw vast (wettelijk kader, resultaten, conclusie) en de opmaak van figuren. Agents van de documentgenerator halen uit het stikstof-, akoestiek- en bodemonderzoek de norm en de conclusie, bewerken ze en zetten ze op hun vaste plek in het rapport. Tot slot haalt een agent uit het sjabloon de regel voor figuren: genummerd, naam cursief.">
  <svg class="lijnen" id="lijnen" viewBox="0 0 1000 1300" aria-hidden="true"></svg>
  <div id="rapporten" aria-hidden="true"></div>
  <div class="gen deel" id="gen" aria-hidden="true">
    <svg viewBox="-30 -30 60 60" fill="none" stroke="#1f2b4f" stroke-linecap="round">
      <circle class="tw" r="17" fill="#fff" stroke-width="8" stroke-dasharray="6 6"/>
      <circle r="6" fill="#fff" stroke-width="2.4"/>
    </svg>
    <b>Documentgenerator</b>
  </div>
  <div class="vel deel" id="vel" aria-hidden="true">
    <div class="veltitel">Rapport</div>
  </div>
  <div class="bak deel" id="bak" aria-hidden="true"><b>Sjabloon</b><ul id="bakregels"></ul></div>
  <svg class="noten" id="noten" viewBox="0 0 1000 1300" aria-hidden="true"></svg>
  <svg class="agents" id="agents" viewBox="0 0 1000 1300" aria-hidden="true"></svg>
</div>
<p class="afzender" id="afzender"><a href="https://www.morphy.world">www.morphy.world</a></p>


<script>
/* ── Hier pas je de inhoud aan ─────────────────────────────── */
// de bak met vaste regels: per bedrijf anders (een lijst, een huisstijl, een afbeelding …)
// soort: titel (kopje in de bak) · sub (hoort bij de titel erboven) · los (eigen regel)
const VASTE_REGELS = [
  { t: "Opbouw", soort: "titel" }, { t: "1 Wettelijk kader", soort: "sub" }, { t: "2 Resultaten", soort: "sub" }, { t: "3 Conclusie", soort: "sub" },
  { t: "Figuren", soort: "titel" }, { t: "genummerd, naam cursief", soort: "sub" },
];
// het vaste sjabloon, van boven naar onder. soort: kop · tekst (vaste tekst) · figuur · vak (vaste plek, vak = naam van het rapport)
// bak = welke regel uit VASTE_REGELS dit onderdeel aan het begin neerzet · later = regel die de laatste agent hier toepast, invul = het resultaat · top / h in % van het vel
const REGELS = [
  { regel: "1 Wettelijk kader",     soort: "kop",    bak: 1, top: 12,   h: 4  },
  { regel: "norm per rapport",      soort: "kader",          top: 16,   h: 10 },
  { regel: "2 Resultaten",          soort: "kop",    bak: 2, top: 27,   h: 4  },
  { regel: "Ligging plangebied",    soort: "figuur", later: 5, invul: "Figuur 1 — Ligging plangebied", top: 31.5, h: 11 },
  { regel: "3 Conclusie",           soort: "kop",    bak: 3, top: 50, h: 4 },
  { regel: "Bevindingen stikstof",  soort: "vak", vak: "Stikstof",  top: 55.5, h: 10 },
  { regel: "Bevindingen akoestiek", soort: "vak", vak: "Akoestiek", top: 68,   h: 10 },
  { regel: "Bevindingen bodem",     soort: "vak", vak: "Bodem",     top: 80.5, h: 10 },
];
const REGELKLEUR = { k: "#fbefbd", kd: "#b8952a" };
// de rapporten: passage zoals hij in het rapport staat → zoals de agent hem in het sjabloon zet
const RAPPORTEN = [
  { naam: "Stikstof",  k: "#d4ecd8", kd: "#3f8f55",
    kader: "Natura 2000-activiteit, art. 5.1 Ow",  kaderBewerkt: "Stikstof: art. 5.1 Omgevingswet",
    origineel: "depositie 0,00 mol/ha/jr op Natura 2000", bewerkt: "Geen effect op Natura 2000" },
  { naam: "Akoestiek", k: "#cfe0f6", kd: "#3b6fd1",
    kader: "Bkl: standaardwaarde wegverkeer 53 dB", kaderBewerkt: "Geluid: standaardwaarde 53 dB",
    origineel: "Lden 52 dB op de gevel, norm 53 dB",       bewerkt: "Geluid voldoet aan de norm" },
  { naam: "Bodem",     k: "#fbe1c4", kd: "#c07a2c",
    kader: "omgevingsplan: kwaliteit passend bij functie", kaderBewerkt: "Bodem: past bij de functie",
    origineel: "lichte verontreiniging, geen sanering",    bewerkt: "Bodem geschikt, geen sanering" },
];
// uitleg die aan het eind verschijnt: van punt (x,y) op het onderdeel een lijntje naar het tekstblok (x,y,w in plaat-eenheden)
// kant: links of rechts van de tekening; de tekening loopt van x 0 tot 1000, de uitleg staat daarbuiten
// bijschriften tijdens de animatie: naast het onderdeel waar ze bij horen (x,y in plaat-eenheden 1000×1300)
const B_W = 360;
const BIJSCHRIFTEN = {
  rapport:     { tekst: "Er moet een rapport komen.",            kant: "rechts", x: 905, y: 560 },
  sjabloon:    { tekst: "Het sjabloon bepaalt de opbouw.",       kant: "links",  x: -15, y: 760 },
  onderzoeken: { tekst: "De inhoud komt uit de onderzoeken.",    kant: "links",  x: -10, y: 150 },
  generator:   { tekst: "De generator zoekt, analyseert en herschrijft elke passage.", kant: "rechts", x: 735, y: 440, w: 600 },
  elk:         { tekst: "Zo gaat het met elk onderzoek.",          kant: "rechts", x: 735, y: 440 },
  opmaak:      { tekst: "Ook de opmaak komt uit het sjabloon.",   kant: "links",  x: -15, y: 760 },
};
const NOTEN = [
  { kop: "Onderzoeken", kant: "links", tekst: "Gedaan door adviesbureaus en opgevraagd voor het project. Uit elk onderzoek komen de norm (wettelijk kader) en de conclusie.",
    van: { x: 18, y: 140 }, naar: { x: -140, y: 140 }, w: 300 },
  { kop: "Documentgenerator", kant: "rechts", tekst: "Zet agents aan het werk. Een agent haalt een passage uit een onderzoek of uit het sjabloon, de generator herschrijft die, en de agent zet hem op zijn vaste plek in het rapport.",
    van: { x: 690, y: 440 }, naar: { x: 1140, y: 440 }, w: 300 },
  { kop: "Sjabloon", kant: "links", tekst: "Per bedrijf vastgelegd: de opbouw en de opmaak, zoals de nummering van figuren. Bepaalt hoe het rapport eruitziet.",
    van: { x: 12, y: 790 }, naar: { x: -140, y: 790 }, w: 300 },
  { kop: "Rapport", kant: "rechts", tekst: "Wat de generator oplevert. Opbouw en opmaak volgen het sjabloon; de inhoud komt uit de onderzoeken.",
    van: { x: 708, y: 900 }, naar: { x: 1140, y: 900 }, w: 300 },
];
const T = {
  begin: 700,     // alles grijs, voordat het sjabloon naar voren komt
  leeg: 180,       // tussen twee grijze vakken van de lege opbouw
  leegKlaar: 1300,  // lege opbouw staat, daarna komt het sjabloon
  start: 500,     // het rapport groot in beeld voordat het sjabloon oplicht
  regel: 420,     // per regel op het vel
  klaar: 500,     // even stil op het afgemaakte sjabloon, dan terug naar achteren
  eerste: 0.32,   // snelheid eerste agent (eenheden per ms) — rustig
  rest: 0.6,      // snelheid volgende agents
  tussen: 900,    // tijd tussen het vertrek van de volgende agents
  regels: 0.32,
  uitleg: 900,    // stilte tussen de laatste agent en de uitleg   // snelheid agent die de vaste regels toepast
};
/* ──────────────────────────────────────────────────────────── */

// plaat-coördinaten (1000 × 1300)
const RAP_X = [30, 370, 710], RAP_W = 260, RAP_ONDER = 280;
const GEN = { x: 500, y: 440, boven: 360, onder: 520 }, VEL_BOVEN = 640;
const ANKER = [420, 500, 580];   // waar de lijnen bovenop de generator vertrekken
const BAK = { x: 120, boven: 676 }, GEN_LINKS = 330;

const $ = id => document.getElementById(id);
const wacht = ms => new Promise(r => setTimeout(r, ms));
const NS = "http://www.w3.org/2000/svg";
let run = 0;

function bouw() {
  // lijnen: generator ↔ rapporten, generator ↔ sjabloon
  $("lijnen").innerHTML =
    RAPPORTEN.map((r, i) => `<path class="lijn" d="M${ANKER[i]},${GEN.boven} L${RAP_X[i] + RAP_W / 2},${RAP_ONDER}"/>`).join("") +
    `<path class="lijn" d="M${GEN.x},${GEN.onder} L${GEN.x},${VEL_BOVEN}"/>` +
    `<path class="lijn" d="M${GEN_LINKS},${GEN.y} L${BAK.x},${BAK.boven}"/>`;
  $("bakregels").innerHTML = VASTE_REGELS.map(r => `<li class="${r.soort}">${r.t}</li>`).join("");
  $("bak").className = "bak geest";
  // rapporten
  $("rapporten").innerHTML = RAPPORTEN.map((r, i) =>
    `<div class="rap deel geest" style="left:${RAP_X[i] / 10}%;--k:${r.k};--kd:${r.kd}">
       <b>${r.naam}</b><small>onderzoek</small>
       <small class="hfd">Wettelijk kader</small><div class="pass k">${r.kader}</div>
       <small class="hfd">Conclusie</small><div class="pass c">${r.origineel}</div></div>`).join("");
  // generator en vel naar achteren
  $("gen").className = "gen deel geest";
  $("vel").className = "vel deel geest";
  $("agents").innerHTML = "";
  $("noten").classList.remove("aan");
  $("plaatkop").classList.remove("aan");
  $("afzender").classList.remove("aan");
  $("stage").querySelectorAll(".bijschrift").forEach(b => b.remove());
  for (const [naam, b] of Object.entries(BIJSCHRIFTEN)) {
    const d = document.createElement("div");
    d.className = "bijschrift " + b.kant; d.id = "bs-" + naam; d.innerHTML = `<span>${b.tekst}</span>`;
    const w = b.w || B_W;
    d.style.left = (b.kant === "links" ? b.x - w : b.x) / 10 + "%"; d.style.top = b.y / 13 + "%"; d.style.width = w / 10 + "%";
    $("stage").appendChild(d);
  }
  $("noten").innerHTML = NOTEN.map(n => `<circle class="nootstip" cx="${n.van.x}" cy="${n.van.y}" r="4"/>
    <path class="nootlijn" d="M${n.van.x},${n.van.y} L${n.naar.x},${n.naar.y} ${n.van.x === n.naar.x
      ? `M${n.naar.x - 12},${n.naar.y} L${n.naar.x + 12},${n.naar.y}`
      : `M${n.naar.x},${n.naar.y - 12} L${n.naar.x},${n.naar.y + 12}`}"/>`).join("");
  $("stage").querySelectorAll(".noot").forEach(n => n.remove());
  NOTEN.forEach(n => {
    const d = document.createElement("div");
    d.className = "noot " + n.kant; d.innerHTML = `<b>${n.kop}</b>${n.tekst}`;
    const x = n.kant === "links" ? n.naar.x - 14 - n.w : n.naar.x + 14;
    d.style.left = x / 10 + "%"; d.style.top = (n.naar.y - 30) / 13 + "%"; d.style.width = n.w / 10 + "%";
    $("stage").appendChild(d);
  });
  $("stage").querySelectorAll(".kaart").forEach(k => k.remove());
  // vakken op het vel
  $("vel").querySelectorAll(".zone, .koppel").forEach(z => z.remove());
  return REGELS.map(r => {
    const z = document.createElement("div");
    z.className = "zone";
    z.style.top = r.top + "%"; z.style.height = r.h + "%";
    if (r.soort === "vak") { z.classList.add("vakzone"); z.innerHTML = `<span class="tag kop">${r.regel}</span><i class="leeg"></i>`; z.dataset.vak = r.vak; }
    else if (r.soort === "kop") { z.classList.add("kopzone"); z.innerHTML = `<span class="tag hk">${r.regel}</span>`; }
    else if (r.soort === "kader") { z.classList.add("tekstzone", "kaderzone"); z.innerHTML = RAPPORTEN.map(x => `<div class="kr" data-vak="${x.naam}"></div>`).join(""); }
    else if (r.soort === "figuur") {
      z.classList.add("figuurzone"); z.style.left = z.style.right = "28%";
      z.innerHTML = `<svg class="schets" viewBox="0 0 80 40" fill="none" stroke="#1f2b4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 30 C20 26 34 18 78 12" stroke-width="3" stroke="#c9cfdd"/><path d="M30 4 L30 38" stroke-width="2.4" stroke="#c9cfdd"/>
        <path d="M40 18 L62 15 L64 31 L43 34 Z" fill="#dcf1e0" stroke="#3f8f55" stroke-dasharray="3 2"/>
        <rect x="8" y="6" width="9" height="7"/><rect x="10" y="33" width="8" height="5"/><rect x="66" y="22" width="8" height="8"/></svg>
        <em class="tag cap">${r.regel.toLowerCase()}</em>`;
    }
    $("vel").appendChild(z);
    return z;
  });
}

// element → middelpunt in plaat-eenheden
function eenheden(el) {
  const st = $("stage").getBoundingClientRect(), r = el.getBoundingClientRect(), f = 1000 / st.width;
  return { x: (r.left + r.width / 2 - st.left) * f, y: (r.top + r.height / 2 - st.top) * f };
}

function maakAgent() {
  const g = document.createElementNS(NS, "g");
  g.classList.add("agent");
  g.innerHTML = `<circle r="26" fill="#fff" stroke="#1f2b4f" stroke-width="2.6"/>
    <circle class="tw" r="11" fill="#dfeaf8" stroke="#1f2b4f" stroke-width="7" stroke-dasharray="4.5 4.5"/>
    <circle r="4" fill="#fff" stroke="#1f2b4f" stroke-width="1.8"/>`;
  g.setAttribute("transform", `translate(${GEN.x},${GEN.y})`);
  g.style.opacity = 0; g.style.transition = "opacity .35s";
  $("agents").appendChild(g);
  requestAnimationFrame(() => g.style.opacity = 1);
  return g;
}

// agent (en eventueel zijn kaartje) rijdt langs een reeks punten
function rij(agent, kaart, pts, snelheid, ok) {
  const seg = pts.slice(1).map((p, i) => Math.hypot(p.x - pts[i].x, p.y - pts[i].y));
  const totaal = seg.reduce((a, b) => a + b, 0), duur = totaal / snelheid;
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  return new Promise(klaar => {
    const t0 = performance.now();
    (function stap(nu) {
      if (!ok()) return klaar();
      const t = Math.min(1, (nu - t0) / duur);
      let d = ease(t) * totaal, i = 0;
      while (i < seg.length - 1 && d > seg[i]) { d -= seg[i]; i++; }
      const a = pts[i], b = pts[i + 1], f = seg[i] ? d / seg[i] : 1;
      const x = a.x + (b.x - a.x) * f, y = a.y + (b.y - a.y) * f;
      agent.setAttribute("transform", `translate(${x},${y})`);
      if (kaart) { kaart.style.left = Math.min(880, Math.max(120, x)) / 10 + "%"; kaart.style.top = (y + 32) / 13 + "%"; }
      t < 1 ? requestAnimationFrame(stap) : klaar();
    })(t0);
  });
}

// één agent: naar het rapport, passage kopiëren, terug, bewerken in de generator, naar het vak in het sjabloon
async function opPad(i, snelheid, traag, ok) {
  const r = RAPPORTEN[i];
  const kaartEl = $("rapporten").children[i], passK = kaartEl.querySelector(".pass.k"), pass = kaartEl.querySelector(".pass.c");
  const thuis = { x: GEN.x, y: GEN.y }, anker = { x: ANKER[i], y: GEN.boven };
  const bijRapport = { x: RAP_X[i] + RAP_W / 2, y: RAP_ONDER + 34 };
  const a = maakAgent();
  await wacht(300); if (!ok()) return;

  await rij(a, null, [thuis, anker, bijRapport], snelheid, ok); if (!ok()) return;
  passK.classList.add("mark");                      // de agent leest de norm en de conclusie ...
  await wacht(traag ? 350 : 280); if (!ok()) return;
  passK.classList.remove("mark"); pass.classList.add("mark");
  await wacht(traag ? 350 : 280); if (!ok()) return;
  const k = document.createElement("div");          // ... en neemt van beide een kopie mee; het rapport blijft heel
  k.className = "kaart"; k.innerHTML = `${r.kader}<hr>${r.origineel}`;
  k.style.setProperty("--k", r.k); k.style.setProperty("--kd", r.kd);
  $("stage").appendChild(k);
  pass.classList.remove("mark");

  await rij(a, k, [bijRapport, anker, thuis], snelheid, ok); if (!ok()) return;
  $("gen").classList.add("werkt");                  // in de generator: analyseren, interpreteren, bewerken
  await wacht(traag ? 900 : 500); if (!ok()) return;
  k.classList.add("bewerkt"); k.innerHTML = `${r.kaderBewerkt}<hr>${r.bewerkt}`;
  await wacht(traag ? 500 : 250); if (!ok()) return;
  $("gen").classList.remove("werkt");

  // eerst de norm onder 1 Wettelijk kader ...
  const kr = $("vel").querySelector(`.kr[data-vak="${r.naam}"]`), d1 = eenheden(kr), p1 = { x: d1.x, y: d1.y - 40 };
  await rij(a, k, [thuis, { x: GEN.x, y: GEN.onder }, { x: GEN.x, y: VEL_BOVEN }, p1], snelheid, ok); if (!ok()) return;
  kr.style.setProperty("--k", r.k); kr.style.setProperty("--kd", r.kd);
  kr.classList.add("vol"); kr.textContent = r.kaderBewerkt;
  k.textContent = r.bewerkt;
  await wacht(traag ? 450 : 250); if (!ok()) return;

  // ... dan de bevinding onder 3 Conclusie
  const vak = $("vel").querySelector(`.zone[data-vak="${r.naam}"]`), doel = eenheden(vak);
  await rij(a, k, [p1, { x: doel.x, y: doel.y - 40 }], snelheid, ok);
  if (!ok()) return;
  const l = document.createElement("div");
  l.className = "landing"; l.textContent = r.bewerkt;
  vak.style.setProperty("--k", r.k); vak.style.setProperty("--kd", r.kd);
  vak.classList.add("gevuld"); vak.appendChild(l);
  k.style.opacity = 0; a.style.opacity = 0;
  await wacht(400); k.remove(); a.remove();
}

// laatste agent: haalt de vaste regels uit de bak en past ze toe op het sjabloon
async function opRegels(snelheid, ok) {
  const thuis = { x: GEN.x, y: GEN.y }, links = { x: GEN_LINKS, y: GEN.y }, bijBak = { x: BAK.x, y: BAK.boven - 34 };
  const a = maakAgent();
  await wacht(300); if (!ok()) return;
  await rij(a, null, [thuis, links, bijBak], snelheid, ok); if (!ok()) return;
  const doelen = REGELS.map((r, i) => ({ r, i })).filter(o => o.r.later !== undefined);
  for (const o of doelen) $("bakregels").children[o.r.later].classList.add("mark");   // het regeltje wordt gearceerd, zoals een passage in een onderzoek
  await wacht(900); if (!ok()) return;
  const k = document.createElement("div");
  k.className = "kaart"; k.textContent = "Figuren: genummerd, naam cursief";
  k.style.setProperty("--k", REGELKLEUR.k); k.style.setProperty("--kd", REGELKLEUR.kd);
  $("stage").appendChild(k);
  for (const li of $("bakregels").children) li.classList.remove("mark");

  await rij(a, k, [bijBak, links, thuis], snelheid, ok); if (!ok()) return;
  $("gen").classList.add("werkt");                  // pas in de generator wordt de regel toegepast
  await wacht(1100); if (!ok()) return;
  k.classList.add("bewerkt"); k.innerHTML = "<em>Figuur 1 — Ligging plangebied</em>";
  await wacht(600); if (!ok()) return;
  $("gen").classList.remove("werkt");

  const zones = $("vel").querySelectorAll(".zone");
  let vorige = { x: GEN.x, y: VEL_BOVEN };
  await rij(a, k, [thuis, { x: GEN.x, y: GEN.onder }, vorige], snelheid, ok); if (!ok()) return;
  for (const o of doelen) {
    const z = zones[o.i], d = eenheden(z), doel = { x: d.x, y: d.y - 40 };
    await rij(a, k, [vorige, doel], snelheid, ok); if (!ok()) return;
    vorige = doel;
    z.style.setProperty("--k", REGELKLEUR.k); z.style.setProperty("--kd", REGELKLEUR.kd);
    const cap = z.querySelector(".cap");
    cap.textContent = o.r.invul; cap.classList.add("regel");
    z.classList.add("gevuld");
    await wacht(450); if (!ok()) return;
  }
  k.style.opacity = 0; a.style.opacity = 0;
  await wacht(400); k.remove(); a.remove();
}

// bijschrift naast een onderdeel: fadet in, blijft even staan, fadet weer weg; nooit twee tegelijk
function bijschrift(naam, duur, ok) {
  const b = $("bs-" + naam);
  const ander = [...$("stage").querySelectorAll(".bijschrift.aan")].filter(x => x !== b);
  ander.forEach(x => x.classList.remove("aan"));
  const wacht0 = ander.length ? 500 : 0;
  setTimeout(() => { if (ok()) b.classList.add("aan"); }, wacht0);
  setTimeout(() => { if (ok()) b.classList.remove("aan"); }, wacht0 + duur);
  return wacht0;   // na hoeveel ms het bijschrift begint te verschijnen
}
async function speel() {
  const id = ++run;
  const ok = () => id === run;
  const zones = bouw();
  await wacht(T.begin); if (!ok()) return;

  // 1. het sjabloon komt naar voren en wordt groot
  $("vel").classList.remove("geest"); $("vel").classList.add("groot");
  bijschrift("rapport", 2400, ok);
  await wacht(T.start); if (!ok()) return;
  for (const z of zones) { z.classList.add("voor"); await wacht(T.leeg); if (!ok()) return; }   // de lege opbouw
  await wacht(T.leegKlaar); if (!ok()) return;

  // 2. eerst het bijschrift, een halve seconde later licht de bak met vaste regels op …
  const bsWacht = bijschrift("sjabloon", 4600, ok);
  await wacht(bsWacht + 500); if (!ok()) return;
  $("bak").classList.remove("geest"); $("bak").classList.add("focus");
  await wacht(900); if (!ok()) return;

  // 3. … en elke regel krijgt zijn plek op het sjabloon
  const lis = $("bakregels").children;
  for (let i = 0; i < zones.length; i++) {
    const z = zones[i], li = REGELS[i].bak !== undefined ? lis[REGELS[i].bak] : null;
    z.classList.remove("voor"); z.classList.add("gloei"); if (li) { li.classList.add("gloei"); lis[0].classList.add("gloei"); }
    await wacht(T.regel); if (!ok()) return;
    setTimeout(() => { z.classList.remove("gloei"); z.classList.add("vast"); if (li) { li.classList.remove("gloei"); lis[0].classList.remove("gloei"); } }, 500);
  }
  await wacht(600 + T.klaar); if (!ok()) return;

  // 4. sjabloon terug naar achteren, grijs
  $("vel").classList.remove("groot"); $("vel").classList.add("geest");
  $("bak").classList.remove("focus"); $("bak").classList.add("geest");
  await wacht(800); if (!ok()) return;

  // 5. de rapporten komen naar voren
  bijschrift("onderzoeken", 3200, ok);
  for (const r of $("rapporten").children) { r.classList.remove("geest"); r.classList.add("focus"); await wacht(250); if (!ok()) return; }
  await wacht(1350); if (!ok()) return;   // tijd om het bijschrift te lezen

  // 6. de documentgenerator komt naar voren, met zijn toegang tot rapporten en sjabloon
  $("gen").classList.remove("geest"); $("gen").classList.add("focus");
  await wacht(300); if (!ok()) return;
  for (const l of $("lijnen").children) l.classList.add("aan");
  await wacht(600); if (!ok()) return;

  // 7. de agents gaan op pad; het sjabloon komt erbij zodra er iets in komt
  bijschrift("generator", 60000, ok);   // blijft staan tot het volgende bijschrift hem vervangt
  const eerste = opPad(0, T.eerste, true, ok);
  await wacht(2600); if (!ok()) return;
  $("vel").classList.remove("geest");
  await eerste; if (!ok()) return;
  await wacht(400); if (!ok()) return;
  bijschrift("elk", 4200, ok);
  await Promise.all(RAPPORTEN.slice(1).map((_, j) => wacht(j * T.tussen).then(() => ok() && opPad(j + 1, T.rest, false, ok))));
  if (!ok()) return;

  // 8. tot slot: de vaste regels van het bedrijf uit de bak
  await wacht(600); if (!ok()) return;
  $("bak").classList.remove("geest"); $("bak").classList.add("focus");
  bijschrift("opmaak", 3600, ok);
  await wacht(800); if (!ok()) return;
  await opRegels(T.regels, ok); if (!ok()) return;

  // 9. stilstand: de uitleg bij de onderdelen
  await wacht(T.uitleg); if (!ok()) return;
  $("noten").classList.add("aan");
  $("plaatkop").classList.add("aan");
  $("afzender").classList.add("aan");
  $("stage").querySelectorAll(".noot").forEach(n => n.classList.add("aan"));
}

$("opnieuw").addEventListener("click", speel);
$("stage").classList.add("bs-c");   // gekozen bijschriftstijl: label 1, donker
speel();
