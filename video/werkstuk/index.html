<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zo maak je een rapport · Regelrapport</title>
<meta name="description" content="In tien stappen door één rapport: sjabloon kiezen, stukken aanleveren, vragen bevestigen, de tekst nalezen en laten nakijken. Een verzonnen voorbeeld.">
<style>
/* Video A: de eindgebruiker loopt door één werkstuk. Een nagebouwd, vereenvoudigd venster in de kleuren van de
   proeftuin. Elke scène is een rij stappen; de eindtoestand van scène N is alle stappen tot en met N, direct gezet.
   ?scene=N zet die eindtoestand neer en pauzeert. Bewust één licht thema. */
:root{
  --merk:#6b1a7d;--merk-700:#541462;--merk-200:#d7bddf;--merk-100:#e6d3eb;--merk-50:#f3e8f5;
  --g50:#fcfbfd;--g100:#f4f1f5;--g200:#e8e4ea;--g300:#d6d0d9;--g400:#9c95a1;--g500:#6b6570;--g700:#3d3742;--g800:#28232c;
  --groen:#1d7f37;--groen-50:#e9f8ed;--groen-100:#c9ecd3;
  --amber:#9a5600;--amber-50:#fff4e2;--amber-100:#ffe8b8;--amber-200:#ffd28a;--amber-300:#f0b445;
  --rood:#b42318;--blauw:#2b5a8f;--blauw-50:#e3ecf7;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --doc:Georgia,"Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--g100);color:var(--g800)}
body{margin:0;font:16px/1.5 var(--ui);-webkit-font-smoothing:antialiased;
  padding:18px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
.pagina{max-width:min(1240px,calc((100vh - 232px) * 16 / 9));min-width:min(100%,300px);margin:0 auto}
.kop{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;margin-bottom:12px}
.kop h1{font-size:clamp(20px,2.6vw,26px);line-height:1.2;margin:0;color:var(--g800)}
.kop p{margin:0;color:var(--g500);font-size:15px}

.wrap{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:10px;border:1px solid var(--g300);
  background:var(--g50);box-shadow:0 2px 10px rgba(20,17,23,.08)}
#app{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;font:15px/1.45 var(--ui);color:var(--g800);overflow:hidden}
#app *{transition:background-color .45s,border-color .45s,color .45s,opacity .45s,transform .6s cubic-bezier(.3,.1,.2,1),max-height .6s,box-shadow .45s}
#app.inst *,#app.inst{transition:none!important}

/* balk */
.balk{height:48px;display:flex;align-items:center;gap:22px;padding:0 24px;background:#fff;border-bottom:1px solid var(--g200)}
.logo{font-weight:700;display:flex;gap:8px;align-items:center}.logo i{width:18px;height:18px;border-radius:5px;background:var(--merk)}
.wsnaam{font-weight:600;color:var(--g700);opacity:0}.wsnaam small{font-weight:400;color:var(--g500);margin-left:8px;font-size:13px}
.tabs{display:flex;gap:4px;margin-left:auto;opacity:0}
.tabs b{font-weight:500;color:var(--g700);padding:6px 12px;border-radius:6px}
#app.is-ws .wsnaam,#app.is-ws .tabs{opacity:1}
#app[data-tab="context"] .tabs [data-t="context"],#app[data-tab="vragen"] .tabs [data-t="vragen"],
#app[data-tab="document"] .tabs [data-t="document"],#app[data-tab="eind"] .tabs [data-t="eind"]{background:var(--merk-50);color:var(--merk-700);font-weight:700}

.paneel{position:absolute;left:0;right:0;top:48px;bottom:0;padding:20px 24px;display:none;overflow:hidden}
#app[data-tab="start"] .p-start,#app[data-tab="context"] .p-context,#app[data-tab="vragen"] .p-vragen,
#app[data-tab="document"] .p-document,#app[data-tab="eind"] .p-eind{display:block}
h2{font-size:19px;margin:0 0 4px}h3{font-size:15px;margin:0}
.zacht{color:var(--g500)}
.knop{display:inline-flex;align-items:center;gap:6px;background:var(--merk);color:#fff;font-weight:600;border-radius:7px;padding:8px 16px;border:1px solid var(--merk)}
.knop.licht{background:#fff;color:var(--merk-700);border-color:var(--merk-200)}
.knop.klein{padding:4px 10px;font-size:13.5px}

/* start */
.p-start{background:var(--g100)}
.kaart{background:#fff;border:1px solid var(--g200);border-radius:10px;padding:22px 24px;box-shadow:0 1px 3px rgba(20,17,23,.07)}
.nieuw-ws{width:560px;margin:64px auto 0;position:relative}
.nieuw-ws label{display:block;font-size:13px;font-weight:600;color:var(--g500);margin:16px 0 5px}
.veld{height:40px;border:1px solid var(--g300);border-radius:7px;padding:0 12px;display:flex;align-items:center;background:var(--g50);font-size:16px}
.veld.kies{justify-content:space-between;color:var(--g400)}.veld.kies.gekozen{color:var(--g800);border-color:var(--merk-200);background:var(--merk-50)}
.veld.kies::after{content:"";border:5px solid transparent;border-top-color:var(--g500);transform:translateY(3px)}
.dd{position:absolute;left:24px;right:24px;top:196px;margin:0;padding:6px;list-style:none;background:#fff;border:1px solid var(--g300);border-radius:8px;
  box-shadow:0 8px 24px rgba(20,17,23,.16);opacity:0;transform:translateY(-6px);pointer-events:none;z-index:3}
.dd li{padding:8px 10px;border-radius:6px}.dd li:first-child{background:var(--merk-50);color:var(--merk-700);font-weight:600}
.dd li small{display:block;color:var(--g500);font-weight:400;font-size:12.5px}
#app.is-ddopen .dd{opacity:1;transform:none}
.nieuw-ws .knop{margin-top:22px}

/* context */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:18px}
.slot{background:#fff;border:1.5px dashed var(--g300);border-radius:10px;padding:16px 18px;height:250px;position:relative}
.slot.in{border-style:solid;border-color:var(--groen-100)}
.slot .st{font-size:13.5px;color:var(--g500);margin-top:6px}
.slot .st .ja{display:none;color:var(--groen);font-weight:600}.slot.in .st .ja{display:inline}.slot.in .st .nee{display:none}
.bestand{margin-top:22px;border:1px solid var(--g200);border-radius:8px;padding:12px 14px;background:var(--g50);display:flex;gap:12px;align-items:center;
  opacity:0;transform:translate(60px,-150px) rotate(6deg)}
.slot.in .bestand{opacity:1;transform:none;box-shadow:0 1px 3px rgba(20,17,23,.08)}
.bestand i{width:30px;height:38px;border-radius:4px;border:1.5px solid var(--g400);background:#fff;flex:none;
  background-image:linear-gradient(var(--g300),var(--g300)),linear-gradient(var(--g300),var(--g300)),linear-gradient(var(--g300),var(--g300));
  background-size:16px 2px;background-repeat:no-repeat;background-position:6px 10px,6px 17px,6px 24px}
.bestand b{display:block;font-size:14.5px}.bestand small{color:var(--g500)}
.inbreng{margin-top:22px;height:118px;border:1px solid var(--g200);border-radius:8px;background:var(--g50);padding:10px 12px;color:var(--g400);font-size:14px}
.p-context .onder{position:absolute;right:24px;bottom:24px;display:flex;gap:16px;align-items:center}

/* vragen */
.p-vragen .twee{display:grid;grid-template-columns:680px 1fr;gap:20px;height:100%}
.werkbalk{display:flex;align-items:center;gap:14px;height:38px;margin-bottom:10px}
.werkbalk .tekst .b,.werkbalk .tekst .c{display:none}
#app.is-laden .werkbalk .tekst .a,#app.is-opgehaald .werkbalk .tekst .a{display:none}
#app.is-laden .werkbalk .tekst .b{display:inline}#app.is-opgehaald .werkbalk .tekst .c{display:inline}
#app.is-laden #voorzet{opacity:.55}
.vraag{background:#fff;border:1px solid var(--g200);border-left:4px solid var(--g300);border-radius:8px;padding:10px 14px;margin-bottom:10px;min-height:112px}
.vraag .vkop{font-weight:700;font-size:15.5px;display:flex;gap:8px;align-items:baseline}
.vraag .nr{font-size:12px;font-weight:700;color:var(--g500);background:var(--g100);border-radius:4px;padding:1px 6px}
.vraag .leegtxt,.vraag .voorstel,.vraag .openblok{display:none;margin-top:7px}
.vraag.leeg .leegtxt{display:block;color:var(--g400)}
.vraag.geel .voorstel,.vraag.groen .voorstel{display:block}.vraag.open .openblok{display:block}
.vraag.geel{border-left-color:var(--amber-300);background:var(--amber-50)}
.vraag.groen{border-left-color:var(--groen)}
.vraag.open{border-left-color:var(--merk)}
.rij{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.waarde{font-weight:700;padding:3px 10px;border-radius:6px;background:var(--amber-100);border:1px solid var(--amber-200)}
.vraag.groen .waarde{background:var(--groen-50);border-color:var(--groen-100)}
.bev{font-size:13.5px;font-weight:700;color:var(--amber);background:#fff;border:1px solid var(--amber-300);border-radius:6px;padding:3px 10px}
.ok{display:none;font-size:13.5px;font-weight:700;color:var(--groen)}
.vraag.groen .bev{display:none}.vraag.groen .ok{display:inline}
.label{font-size:12px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.04em}
.vraag.groen .label{display:none}
.bron{margin-top:6px;font-size:13.5px;color:var(--g700)}.bron b{color:var(--g800)}.bron q{font-family:var(--doc);font-style:italic;quotes:"\201C" "\201D"}
.opt{border:1px solid var(--g300);border-radius:999px;padding:3px 12px;background:#fff;font-size:14px}
.opt::before{content:"";display:inline-block;width:10px;height:10px;border:1.5px solid var(--g400);border-radius:50%;margin-right:7px;transform:translateY(1px)}
.lnk{color:var(--merk-700);font-weight:600;font-size:14px;margin-left:auto}

.vel{background:#fff;border:1px solid var(--g200);border-radius:6px;box-shadow:0 1px 4px rgba(20,17,23,.08);font-family:var(--doc);color:#1d1a20}
.vel .titel{font-family:var(--ui);font-weight:700}.vel .sub{font-family:var(--ui);color:var(--g500)}
.vel h4{font-family:var(--ui);margin:0}
.voorbeeld{height:100%;padding:18px 22px;font-size:13.5px;line-height:1.5;position:relative}
.voorbeeld .tag0{position:absolute;right:14px;top:12px;font:700 11px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--g400)}
.voorbeeld .titel{font-size:16px}.voorbeeld .sub{font-size:12.5px;margin-bottom:6px}
.voorbeeld h4{font-size:13.5px;margin-top:11px}.voorbeeld p{margin:2px 0 0}
.c .ph{color:var(--g400);border-bottom:1.5px dashed var(--g300);font-style:italic}
.c .val{display:none}
.c.geel .ph,.c.groen .ph{display:none}.c.geel .val,.c.groen .val{display:inline}
.c.geel .val{background:var(--amber-100);border-radius:3px;padding:0 3px}
.c.groen .val{border-bottom:2px solid var(--groen-100);background:var(--groen-50);border-radius:2px;padding:0 2px}
.balkjes i{display:block;height:8px;border-radius:4px;background:var(--g200);margin-top:7px}.balkjes i:last-child{width:62%}
.maat{max-height:0;opacity:0;overflow:hidden;transform:translateX(40px)}
#app.is-maat .maat{max-height:120px;opacity:1;transform:none}
#app.is-maat .voorbeeld .maat{background:var(--merk-50);box-shadow:0 0 0 6px var(--merk-50);border-radius:4px;margin-top:11px}
#app.is-maat .voorbeeld .maat h4{margin-top:0}
.erbij{font:700 11.5px var(--ui);color:var(--merk-700);background:#fff;border:1px solid var(--merk-200);border-radius:999px;padding:1px 8px;margin-left:8px;white-space:nowrap}

.lade{position:absolute;right:24px;top:20px;width:536px;bottom:20px;background:#fff;border:1px solid var(--merk-200);border-radius:10px;padding:16px 20px;
  box-shadow:0 10px 30px rgba(20,17,23,.18);transform:translateX(115%);z-index:4}
#app.is-lade .lade{transform:none}
.lade .v{font-size:13.5px;color:var(--g500);margin-bottom:10px}
.lade h3{margin-top:12px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--g500)}
.staaf{display:grid;grid-template-columns:130px 1fr 24px;gap:10px;align-items:center;margin-top:6px;font-size:14px}
.staaf i{height:12px;border-radius:6px;background:var(--g300)}.staaf.kies{font-weight:700}.staaf.kies i{background:var(--merk)}
.uitkomst{margin-top:8px;font-weight:700;color:var(--merk-700);background:var(--merk-50);border-radius:7px;padding:6px 10px;font-size:14.5px}
.rap{border:1px solid var(--g200);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:13.5px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.rap b{font-size:14.5px}.rap .sc{grid-column:2;font-weight:700;color:var(--groen);font-size:13px;white-space:nowrap}.rap span{grid-column:1/-1;color:var(--g700)}
.rap em{font-style:normal;color:var(--g500)}

/* document */
.p-document .twee{display:grid;grid-template-columns:740px 1fr;gap:20px;height:100%}
.doc{height:100%;padding:24px 34px;font-size:15.5px;line-height:1.55}
.doc .titel{font-size:20px}.doc .sub{font-size:13.5px;margin-bottom:4px}
.doc h4{font-size:15px;margin-top:13px}.doc p{margin:3px 0 0;padding:2px 6px;margin-left:-6px;border-radius:5px;border:1.5px solid transparent}
.doc .g{border-bottom:2px solid var(--groen-100)}
.doc .maat{max-height:140px;opacity:1;transform:none}
#alinea{position:relative}
#app.is-sel #alinea{border-color:var(--merk);background:var(--merk-50)}
.k{border-bottom:2px solid var(--groen-100)}
#app.is-sel .ka{background:var(--blauw-50);border-bottom-color:var(--blauw)}
#app.is-sel .kb{background:var(--merk-100);border-bottom-color:var(--merk)}
#app.is-sel .kc{background:var(--groen-100);border-bottom-color:var(--groen)}
.nieuw{background:var(--amber-100);border-bottom:2px solid var(--amber-300);border-radius:3px;padding:0 3px}
.nieuw.vast{background:var(--groen-50);border-bottom-color:var(--groen-100)}
.bevlabel{font:700 11.5px var(--ui);color:var(--amber);background:#fff;border:1px solid var(--amber-300);border-radius:999px;padding:1px 8px;margin-left:8px;white-space:nowrap}
.zij{height:100%;background:#fff;border:1px solid var(--g200);border-radius:10px;padding:14px 18px;position:relative}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--g200);padding-bottom:10px;margin-bottom:12px;opacity:.35}
#app.is-sel .subtabs{opacity:1}
.subtabs b{font-weight:500;color:var(--g700);padding:5px 11px;border-radius:6px;font-size:14.5px}
#app[data-sub="opbouw"] [data-s="opbouw"],#app[data-sub="bewerken"] [data-s="bewerken"],#app[data-sub="vraag"] [data-s="vraag"]{background:var(--merk-50);color:var(--merk-700);font-weight:700}
.sub-p{display:none}.hint{color:var(--g400);margin-top:30px;text-align:center}
#app.is-sel .hint{display:none}
#app.is-sel[data-sub="opbouw"] .s-opbouw,#app.is-sel[data-sub="bewerken"] .s-bewerken,#app.is-sel[data-sub="vraag"] .s-vraag{display:block}
.onderdeel{display:grid;grid-template-columns:16px 1fr;gap:4px 10px;padding:9px 0;border-bottom:1px solid var(--g200);font-size:14px}
.onderdeel:last-child{border-bottom:0}
.onderdeel i{width:14px;height:14px;border-radius:3px;margin-top:3px;border:1.5px solid var(--g400);background:#fff}
.onderdeel b{font-size:14.5px}.onderdeel span{grid-column:2;color:var(--g700)}.onderdeel q{font-family:var(--doc);font-style:italic;quotes:"\201C" "\201D"}
.onderdeel .vinkje{grid-column:auto;color:var(--groen);font-weight:700;white-space:nowrap}
.opdrachten{display:flex;gap:8px;margin:10px 0 4px}
.bezig{display:none;color:var(--merk-700);font-weight:600;font-size:14px;margin-top:8px}#app.is-werkt .bezig{display:block}
.verloop{margin-top:16px}.verloop h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--g500)}
.versie{border:1px solid var(--g200);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.versie small{display:block;color:var(--g500)}.versie.nu{border-color:var(--merk-200);background:var(--merk-50)}
.versie .terug{color:var(--merk-700);font-weight:600;font-size:13.5px;white-space:nowrap}
.v2{max-height:0;opacity:0;overflow:hidden;padding-top:0;padding-bottom:0;margin-top:0;border-width:0}
#app.is-v2 .v2{max-height:70px;opacity:1;padding:8px 12px;margin-top:8px;border-width:1px}
.v1 .nu-l{display:inline}.v1 .terug{display:none}#app.is-v2 .v1 .nu-l{display:none}#app.is-v2 .v1 .terug{display:inline}
#app.is-v2 .v1{border-color:var(--g200);background:#fff}
.invoer{display:flex;gap:8px}.invoer .veld{flex:1;height:38px;font-size:15px;background:#fff}
.bel{border-radius:10px;padding:8px 12px;margin-top:10px;font-size:14px;max-width:92%}
.bel.jij{background:var(--merk);color:#fff;margin-left:auto;width:max-content;display:none}
.bel.denk{background:var(--g100);color:var(--g500);display:none;width:max-content}
.bel.ant{background:var(--g100);display:none;max-width:100%}
#app.is-gevraagd .bel.jij{display:block}#app.is-gevraagd:not(.is-antwoord) .bel.denk{display:block}#app.is-antwoord .bel.ant{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12.5px;font-weight:600;border:1px solid var(--g300);background:#fff;border-radius:999px;padding:2px 9px;color:var(--g700)}
.voorstelkaart{display:none;margin-top:10px;border:1px solid var(--amber-200);background:var(--amber-50);border-radius:10px;padding:10px 12px;font-size:14px}
#app.is-antwoord .voorstelkaart{display:block}
.voorstelkaart .rij{margin-top:8px;justify-content:space-between}
.voorstelkaart .gedaan{display:none;color:var(--amber);font-weight:700;font-size:13.5px}
#app.is-overgenomen .voorstelkaart .gedaan{display:inline}#app.is-overgenomen #neemover{opacity:.4}

/* eindcontrole */
.p-eind .twee{display:grid;grid-template-columns:380px 1fr;gap:20px;height:100%}
.keuze{border:1px solid var(--g200);border-radius:8px;padding:8px 12px;margin-top:8px;display:flex;gap:10px;align-items:center}
.keuze::before{content:"";width:12px;height:12px;border-radius:50%;border:1.5px solid var(--g400);flex:none}
.keuze.aan{border-color:var(--merk-200);background:var(--merk-50);font-weight:600}.keuze.aan::before{border:4px solid var(--merk)}
.dekking{margin-top:16px;border-radius:8px;padding:10px 12px;background:var(--g100);font-size:14px;color:var(--g700)}
.dekking .b,.dekking .c{display:none}
#app.is-draait .dekking .a,#app.is-gedraaid .dekking .a{display:none}#app.is-draait .dekking .b{display:block}#app.is-gedraaid .dekking .c{display:block}
#app.is-gedraaid .dekking{background:var(--groen-50)}
.meldingen .leeg0{color:var(--g400);margin-top:40px;text-align:center}#app.is-gedraaid .meldingen .leeg0{display:none}
.melding{border:1px solid var(--g200);border-left:4px solid var(--amber-300);border-radius:8px;padding:12px 16px;margin-top:12px;background:#fff;
  display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;opacity:0;transform:translateY(14px)}
#app.is-gedraaid .melding{opacity:1;transform:none}
#app.is-gedraaid #m2{transition-delay:.15s}#app.is-gedraaid #m3{transition-delay:.3s}
.melding b{font-size:15.5px}.melding span{grid-column:1;color:var(--g700);font-size:14px}
.melding .knop,.melding .klaar{grid-column:2;grid-row:1/3}
.melding .klaar{display:none;color:var(--groen);font-weight:700}
.melding.af{border-left-color:var(--groen);background:var(--groen-50)}.melding.af .knop{display:none}.melding.af .klaar{display:inline}
.einde{position:absolute;left:0;right:0;top:48px;bottom:0;background:rgba(252,251,253,.93);display:grid;place-items:center;opacity:0;pointer-events:none;z-index:20}
#app.is-einde .einde{opacity:1;pointer-events:auto}
.einde .kaart{width:620px;text-align:center;padding:34px 36px;transform:translateY(16px)}
#app.is-einde .einde .kaart{transform:none}
.einde h2{font-size:28px}.einde p{font-size:17px;color:var(--g700);margin:8px 0 22px}

/* ── afspelen ── */
function wacht(ms, id) {         // wacht ms, telt niet door tijdens pauze; false als er een nieuwe run is
  return new Promise(klaar => {
    let rest = ms, vorige = performance.now();
    (function tik() {
      if (id !== run) return klaar(false);
      const nu = performance.now(); if (!gepauzeerd) rest -= nu - vorige; vorige = nu;
      rest <= 0 ? klaar(true) : setTimeout(tik, 30);
    })();
  });
}
function leeg() { app.className = ""; app.dataset.tab = "start"; delete app.dataset.sub; app.innerHTML = VENSTER; }
function zetTot(n) {             // de eindtoestand van scène n, zonder beweging (n = -1: het begin)
  app.classList.add("inst");
  leeg(); app.classList.add("inst");
  for (let i = 0; i <= n; i++) for (const [, stap] of SCENES[i].stappen) stap(true);
  void app.offsetWidth;
  app.classList.remove("inst");
}
function toon(n) {
  scene = n;
  document.getElementById("cap").textContent = SCENES[n].cap;
  document.getElementById("capnr").textContent = (n + 1) + " / " + SCENES.length;
  [...document.getElementById("stippen").children].forEach((b, i) => {
    b.classList.toggle("nu", i === n); b.classList.toggle("geweest", i < n);
    i === n ? b.setAttribute("aria-current", "step") : b.removeAttribute("aria-current");
  });
}
function knoptekst() { document.getElementById("pauze").textContent = bezig && !gepauzeerd ? "Pauze" : "Verder"; }
function stil(n) { ++run; bezig = false; gepauzeerd = false; zetTot(n); toon(n); knoptekst(); }
async function speel(vanaf) {
  const id = ++run; bezig = true; gepauzeerd = false; knoptekst();
  zetTot(vanaf - 1);
  for (let n = vanaf; n < SCENES.length; n++) {
    toon(n);
    const s = SCENES[n];
    if (RUSTIG) {                // zonder beweging: de scène staat er meteen, even lang als anders
      zetTot(n);
      if (!await wacht(s.stappen.reduce((t, x) => t + x[0], 0) + s.na, id)) return;
      continue;
    }
    for (const [ms, stap] of s.stappen) {
      if (!await wacht(ms, id)) return;
      const r = stap(false); if (r) await r;
      if (id !== run) return;
    }
    if (!await wacht(s.na, id)) return;
  }
  bezig = false; knoptekst();
}

/* ── schaal, knoppen, start ── */
function schaal() { app.style.transform = "scale(" + wrap.clientWidth / 1280 + ")"; }
addEventListener("resize", schaal); schaal();

const stippen = document.getElementById("stippen");
SCENES.forEach((s, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.title = (i + 1) + ". " + s.cap; b.setAttribute("aria-label", "Stap " + (i + 1) + ": " + s.cap);
  b.addEventListener("click", () => speel(i));
  stippen.appendChild(b);
});
document.getElementById("opnieuw").addEventListener("click", () => speel(0));
document.getElementById("pauze").addEventListener("click", () => {
  if (bezig) { gepauzeerd = !gepauzeerd; knoptekst(); }
  else speel(scene >= SCENES.length - 1 ? 0 : scene + 1);
});

const vraag = new URLSearchParams(location.search).get("scene");
if (vraag !== null && +vraag >= 1 && +vraag <= SCENES.length) stil(+vraag - 1);   // ?scene=N: eindtoestand van scène N, gepauzeerd
else speel(0);
</script>
